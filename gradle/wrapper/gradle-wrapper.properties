distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# services.gradle.org returns a 302 to GitHub, and this machine fails the
# certificate chain check on that hop (PKIX / revocation lookup). The official
# distribution has no distributionSha256Sum published, so switching the mirror
# is safe. Tencent's mirror is used instead.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.4.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
