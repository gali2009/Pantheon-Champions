#勇士系统总开关与生成概率。
#规则：敌对性决定候选池，家族互斥决定勇士类型。
[general]
	#生成时成为勇士的基础概率（0.0 ~ 1.0）。
	#0.12 表示约每 8 只候选生物出现 1 只勇士。
	#注意：这是「基础值」，实际值还会乘以栖息地等修饰符。
	# Default: 0.12
	# Range: 0.0 ~ 1.0
	championChance = 0.12
	#是否允许行为中立的生物成为勇士。
	#影响的生物：末影人、猪灵、僵尸猪灵。
	#它们实现了 Enemy 接口，但不会主动攻击玩家。
	affectNeutralMobs = true
	#禁止获得勇士形态的实体 ID 列表。
	#默认排除 minecraft:giant —— 原版巨人没有攻击 AI，
	#给它任何勇士类型都没有意义。
	blacklist = ["minecraft:giant"]
	#勇士系统总开关。关闭后所有生物按原版行为生成。
	enabled = true

#双态生物（溺尸 drowned / 猪灵 piglin）的类型决定方式。
#设计上双态是「运行时决定」，一只生物不会同时是两种勇士。
[dualState]
	#RANDOM = 生成时抽签并配发对应武器（推荐）。
	#WEAPON = 按手持武器决定（原版猪灵默认持弩，近战分支极少触发）。
	#Allowed Values: RANDOM, WEAPON
	mode = "RANDOM"
	#RANDOM 模式下判为屏障的比例，其余为势不可挡。
	#仅对双态生物生效。
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	barrierRatio = 0.5

#屏障勇士：受伤后架盾，盾期间免伤并从盾后回血。
#玩家必须在护盾再生前破除，否则战斗拖长。
[barrier]
	#护盾被打破后，多少 tick 内不能再生。
	#这是玩家的「破盾窗口」。
	# Default: 60
	# Range: 0 ~ 1200
	regenDelayTicks = 60
	#护盾最长持续 tick（20 tick = 1 秒）。
	#到期自动解除，防止无限僵持。
	# Default: 100
	# Range: 1 ~ 1200
	shieldDurationTicks = 100
	#护盾存在期间每秒回复的生命值。
	#设为 0 则纯免伤，不回血。
	# Default: 4.0
	# Range: 0.0 ~ 100.0
	regenPerSecond = 4.0
	#护盾可吸收的伤害总量。
	# Default: 20.0
	# Range: 1.0 ~ 200.0
	shieldPoints = 20.0
	#护盾被打破后的虚弱 tick 数（无法行动，可被集火）。
	# Default: 40
	# Range: 0 ~ 1200
	breakStunTicks = 40

#栖息地修饰符。栖息地与家族是两条独立的轴：
#家族回答「它是什么」，栖息地回答「它在哪」，两者互不排斥。
[habitat]
	#下界生物成为勇士的概率倍率。
	# Default: 1.5
	# Range: 1.0 ~ 10.0
	netherChanceMultiplier = 1.5
	#下界勇士的护盾量倍率（仅影响屏障类型）。
	# Default: 1.5
	# Range: 1.0 ~ 10.0
	netherShieldMultiplier = 1.5
	#是否让下界生物获得额外强化。
	netherEnabled = true

#调试选项。正式游玩建议全部关闭。
[debug]
	#在勇士头顶显示其类型（客户端调试用）。
	showTypeAboveHead = false
	#在日志中打印每次勇士类型分配结果。
	logAssignments = false

#勇士基础属性倍率。基准是该生物自身的原版属性，
#所以不同生物成为勇士后的绝对数值不同，但相对强度一致。
[championStats]
	#勇士最大生命值倍率。
	#3.5 表示僵尸勇士有 20 × 3.5 = 70 点生命（35 颗心）。
	#倍率基于该生物自身的原版最大生命值，不是固定数值。
	# Default: 3.5
	# Range: 1.0 ~ 100.0
	healthMultiplier = 3.5
	#勇士攻击伤害倍率。
	#1.5 表示勇士的裸伤害是原版的 1.5 倍。
	#注意困难难度本身还会对「打向玩家」的伤害再乘 1.5，
	#两者叠加后，困难难度下勇士伤害 = 原版困难值 × 1.5。
	#只对拥有攻击伤害属性的生物生效（鱼类等被动生物不生效）。
	# Default: 1.5
	# Range: 1.0 ~ 100.0
	damageMultiplier = 1.5

#三种反制附魔的获取途径。
#三种附魔互斥（共用 exclusive_set/champion 标签），
#但与原版 sharpness / smite 等伤害附魔不互斥。
[enchantment]
	#是否可在地牢战利品中出现。
	lootEnabled = true
	#是否可由村民交易获得。
	tradeEnabled = false
	#是否可通过附魔台获得。
	enchantTableEnabled = true

#势不可挡勇士：重装高减伤并向前冲锋。
#玩家必须在冲锋落点前用反制手段造成震慑。
[unstoppable]
	#常驻减伤比例（0.0 ~ 0.95）。
	#0.5 表示受到的伤害减半。
	# Default: 0.5
	# Range: 0.0 ~ 0.95
	damageReduction = 0.5
	#冲锋前的蓄力 tick 数，即玩家的反应窗口。
	#太短会显得无解，太长则没有压力。
	# Default: 30
	# Range: 1 ~ 200
	chargeWindupTicks = 30
	#被震慑后失去减伤与冲锋能力的 tick 数。
	# Default: 60
	# Range: 1 ~ 1200
	staggerDurationTicks = 60
	#蓄力期间可被震慑的窗口 tick 数。
	#只有在此窗口内命中反制附魔才有效。
	# Default: 20
	# Range: 1 ~ 200
	staggerWindowTicks = 20

#勇士的发光描边。按类型区分颜色：
#屏障 = 黄，过载 = 蓝，势不可挡 = 红。
[glow]
	#是否用计分板队伍给描边上色。
	#开启后描边按类型着色，但有两项副作用（原版机制所限，无法回避）：
	#1) 同类型的勇士之间不会互相攻击（原版队伍会屏蔽友军索敌）；
	#2) 勇士的名牌也会染上对应颜色。
	#关闭后描边统一为白色，且无上述副作用。
	colorByTeam = true
	#是否让勇士发光（自带透视描边效果）。
	#关闭后勇士与普通生物外观无区别，只能靠行为辨认。
	enabled = true

#过载勇士：高速自愈与相位机动，需持续打断才能压制。
#对抗要点不是爆发伤害，而是「不让它恢复」。
[overload]
	#相位机动的冷却 tick。
	# Default: 80
	# Range: 1 ~ 2400
	phaseIntervalTicks = 80
	#每秒自愈量。被反制期间停止。
	# Default: 3.0
	# Range: 0.0 ~ 100.0
	regenPerSecond = 3.0
	#是否启用相位机动（短距瞬移／闪避）。
	phaseEnabled = true
	#单次反制命中后，压制自愈的持续 tick。
	#多次命中可刷新，不叠加。
	# Default: 60
	# Range: 1 ~ 1200
	disruptionDurationTicks = 60
