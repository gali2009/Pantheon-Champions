plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id
base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()

    // GeckoLib's own maven. exclusiveContent keeps Gradle from hunting for the
    // software.bernie.geckolib group anywhere else, which matters because the
    // group name is not resolvable from Maven Central.
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroupAndSubgroups('software.bernie.geckolib')
        }
    }

    // JEI publishes to BlameJared's maven, together with the sibling artifacts it
    // depends on (jei-1.21.1-common / -lib / -gui). Those siblings are NOT on
    // Maven Central, so this repository is required for JEI to resolve at all --
    // the artifact alone is not enough.
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroupAndSubgroups('mezz.jei')
            includeGroupAndSubgroups('net.mezzdev.config')
        }
    }

    // Jade has no maven of its own; Modrinth hosts one for the projects it lists.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            // Quick-play straight into a world when asked, which is how the champion
            // behaviour actually gets exercised without clicking through menus:
            //     ./gradlew runClient -PquickPlay="New World"
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay')
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG

            // A forked run does not inherit the shell environment, so pass through
            // every PANTHEON_ switch by prefix rather than maintaining a list that
            // silently goes stale when a new switch is added.
            System.getenv().each { name, value ->
                if (name.startsWith('PANTHEON_')) {
                    environment name, value
                }
            }
        }
    }
}

// Make `build` also leave the IDE run configurations usable.
//
// Why this is needed: the IDEA run configurations in .idea/workspace.xml launch
// net.neoforged.devlaunch.Main with '@build/moddev/clientRunProgramArgs.txt' and
// '@build/moddev/clientRunVmArgs.txt'. Those files are produced by the
// prepareClientRun / prepareServerRun / prepareDataRun tasks -- NOT by `build`.
// java exits with code 1 and "Error: could not open '<path>'" when an @argfile is
// missing, which surfaces in IDEA only as "finished with non-zero exit value 1"
// with no explanation.
//
// `clean` deletes build/, so the sequence "clean, build, press Run in IDEA" used
// to fail every time. Wiring the three prepare tasks into `build` costs about a
// second and makes that sequence work. It also means these files always match the
// current dependency set instead of whatever was generated last time JEI/Jade or
// GeckoLib changed.
tasks.named('build') {
    dependsOn 'prepareClientRun', 'prepareServerRun', 'prepareDataRun'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // GeckoLib: the model and animation runtime the champion mobs will use.
    //
    // The artifact name embeds the Minecraft version, so it is built from
    // minecraft_version rather than hardcoded. GeckoLib 4.x declares no
    // transitive dependencies, so this single line is the whole story.
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // JEI and Jade are DEVELOPMENT-TIME helpers, not runtime requirements.
    //
    // compileOnly -> the mod's own code could compile against their APIs
    // runtimeOnly -> they actually load inside runClient / runServer, which is
    //                what makes them useful for inspecting the mod's content
    //                (JEI: do the enchanted books show up; Jade: what NBT does
    //                this champion actually carry).
    //
    // Deliberately NOT `implementation`, and never referenced in
    // neoforge.mods.toml: the shipped mod must work without either of them.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Jade's version string contains '+', which is Maven's dynamic-version
    // wildcard. That is expected to be rejected, but Gradle accepts it here as
    // written -- verified by resolving runtimeClasspath, not assumed. If Gradle
    // ever tightens this, add a dependency-resolution rule; do NOT trim the '+',
    // which is part of Jade's published version name.
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"

    // TomlHarness is a plain main() harness rather than a JUnit suite: it drives the
    // real ModConfigSpec, regenerates the TOML, and re-reads it.
    testImplementation "com.electronwill.night-config:core:3.8.3"
    testImplementation "com.electronwill.night-config:toml:3.8.3"
}

// The harness in src/test/java needs the same NeoForge surface main compiles against.
// ModDevGradle populates the main source set's classpath with the NeoForge and FML
// loader artifacts (ModConfigSpec, IConfigSpec), but does not repeat them for test,
// so reuse main's classpath wholesale rather than listing artifacts one by one.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// Generates META-INF/neoforge.mods.toml from src/main/templates, substituting the
// gradle.properties values, so mod metadata lives in exactly one place.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             geckolib_version       : geckolib_version,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    // 必须显式指定 UTF-8。ProcessResources 默认用平台编码读模板，本机是 GBK，
    // 而模板里有中文注释：按 GBK 解析 UTF-8 字节不仅变乱码，某些字节序列
    // 还会把紧跟的换行一起吃掉，导致下一行被并进注释里——实测中出现过
    // [[dependencies]] 表头被吞、整个依赖块失效的情况。
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('compileJava') {
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

// 源码里有大量中文注释与中文字符串（配置项的注释会写进 TOML）。
// 不显式指定编码时，javac 按平台默认编码读源码——本机是 GBK。
// 那样虽然有时「看起来能用」（源码被当 GBK 读、输出又按 GBK 写回，恰好自洽），
// 但只要文件里出现 GBK 无法映射的字符（如 emoji、某些标点），就会编译失败或
// 产生乱码，而且报错信息通常指向别处。这里把两端都钉死为 UTF-8。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

// The default test task is off. TomlHarness is a plain main() harness driven by
// Tools/build-and-verify.ps1, not a JUnit suite, so there is nothing for Gradle's
// test task to discover.
tasks.named('test') {
    enabled = false
}

// Runs TomlHarness against the real compiled output, regenerating the config and
// re-reading it to prove it validates.
//
// This exists because the PowerShell script used to hand-maintain a list of the
// jars the harness needed, and that list drifted three separate times (first
// -sources.jar matching, then IEventBus, then slf4j, then Dist) — each one a
// NoClassDefFoundError or "unknown enum constant" that looked like a code fault.
// Gradle already resolves this classpath, so ask it rather than restating it.
tasks.register('verifyConfig', JavaExec) {
    group = 'verification'
    description = 'Regenerate pantheon_champions-common.toml and validate it against the spec.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'beiwu.pantheon_champions.config.TomlHarness'
    args = [layout.projectDirectory.file('pantheon_champions-common.toml').asFile.absolutePath]

    // log4j logs a StatusLogger warning because no backend is on the classpath;
    // that is expected and noise here.
    systemProperty 'log4j2.loggerContextFactory', 'org.apache.logging.log4j.simple.SimpleLoggerContextFactory'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
