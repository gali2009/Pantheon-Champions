## JVM Properties
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## JDK location
## The JDK lives in D:\Java, outside Gradle's default scan path. Declaring it
## explicitly stops the toolchain plugin from trying to download a fresh JDK.
org.gradle.java.home=D:\\Java\\Java21
org.gradle.java.installations.paths=D:\\Java\\Java8,D:\\Java\\Java11,D:\\Java\\Java17,D:\\Java\\Java21

## Network
## maven.neoforged.net resets connections intermittently on this network; retry
## rather than fail.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500

## Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.250
neo_version_range=[21.1.250,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod Properties
## mod_id must satisfy FML's ^[a-z][a-z0-9_]{1,63}$ -- no dots, no hyphens.
## "Pantheon: Champions" flattens to pantheon_champions.
mod_id=pantheon_champions
mod_name=Pantheon: Champions
## 与仓库根目录的 LICENSE 文件保持一致。
## 改这里的同时必须改 LICENSE，否则元数据与实际授权矛盾——
## GitHub 建仓库时默认生成的是 MIT，而模板初始值常写成 All Rights Reserved。
mod_license=MIT
mod_version=0.1.0
mod_group_id=beiwu.pantheon_champions
mod_authors=BeiWu_Arctic
mod_description=Ports Destiny 2's three Champion types (Barrier, Overload, Unstoppable) into Minecraft.

## Dependencies
## GeckoLib supplies the model and animation runtime for the champion mobs.
## The 1.21.1 line is GeckoLib 4.x, whose group is software.bernie.geckolib.
## The current wiki documents GeckoLib5 (group com.geckolib), which does NOT
## serve this artifact -- that path 404s, so do not "update" the group to match
## the wiki page.
geckolib_version=4.9.3

## 开发期辅助模组（JEI / Jade）
## 这两个是**开发环境用的**，用于在游戏里核对本模组的内容：
##   - JEI  看合成/用途、确认附魔书能正常进物品栏
##   - Jade 看方块/实体信息，调试勇士实体时能直接读到 NBT
##
## JEI 坐标：group mezz.jei，artifact 内嵌 MC 版本，发布在 BlameJared 仓库。
## 注意 JEI 有传递依赖（jei-*-common / -lib / -gui），都在同一个仓库，
## 所以 build.gradle 里必须加该仓库，否则解析失败。
jei_version=19.57.0.449

## Jade 发布在 Modrinth 的 Maven（它自己没有 Maven）。
## 坐标是 maven.modrinth:jade:<版本>，注意 group 是 maven.modrinth，
## artifact 用的是 Modrinth 的 **slug**（jade），不是项目 id（nvQzSEkH）。
##
## 版本号**带 '+'**（Modrinth 的命名习惯）。'+' 在 Maven 版本语法里是
## 「动态版本」通配符，理论上 Gradle 会拒绝；但**实测直接这样写可以正常解析**，
## 所以没有做特殊处理。万一将来 Gradle 变严格了，正确修法是加
## dependency-resolution 规则，**不是**删掉 '+'（它是正式版本名的一部分）。
jade_version=15.10.6+neoforge
